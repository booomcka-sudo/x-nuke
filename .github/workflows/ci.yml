name: Verify application
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nuke_test
          POSTGRES_PASSWORD: local_ci_only
          POSTGRES_DB: x_nuke_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://nuke_test:local_ci_only@127.0.0.1:5432/x_nuke_test
      TEST_DATABASE_URL: postgres://nuke_test:local_ci_only@127.0.0.1:5432/x_nuke_test
      REDIS_URL: redis://127.0.0.1:6379
      JWT_SECRET: ci-only-secret-for-disposable-test-services
      DEMO_MODE: 'true'
      VITE_API_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm lint && pnpm test && pnpm build
      - run: pnpm test:db
      - run: pnpm deploy:prepare
      - name: Start API and worker
        run: |
          pnpm start > /tmp/x-nuke-api.log 2>&1 &
          pnpm start:worker > /tmp/x-nuke-worker.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:3000/health/ready; then exit 0; fi
            sleep 1
          done
          cat /tmp/x-nuke-api.log
          exit 1
      - run: pnpm test
        env:
          RUN_INTEGRATION: 'true'
      - run: pnpm --filter @xn/extension build:dev && node scripts/check-manifest.mjs
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          RUN_EXTENSION_E2E: 'true'
      - name: Container builds
        run: |
          docker build -f deploy/Dockerfile.api -t x-nuke-api:ci .
          docker build -f deploy/Dockerfile.worker -t x-nuke-worker:ci .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-artifacts
          path: |
            test-results/
            artifacts/panel-*.png
